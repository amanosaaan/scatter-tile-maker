<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>散らし柄タイルメーカー</title>
<style>
  :root { --bg:#f3f1ee; --panel:#fff; --card:#faf8f5; --ink:#2b2622; --sub:#7a716a; --line:#e3ddd5; --accent:#e8862a;
          --c0:#e8862a; --c1:#4c9a52; --c2:#8a5cc8; --canvas:#e9e6e1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161413; --panel:#221f1d; --card:#2a2623; --ink:#f1ebe4; --sub:#a39a91; --line:#3a3532; --accent:#f0993f;
            --c0:#f0993f; --c1:#6fbf76; --c2:#b08ae6; --canvas:#181614; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; overflow:hidden; }
  button, select, input { font-family:inherit; }
  .sp { flex:1; }

  /* ---- 全体レイアウト: 上バー / 左=素材 / 中央=キャンバス / 右=設定 (画面内に収め、各パネルは必要な時だけ内部スクロール) */
  #app { display:grid; height:100vh; grid-template-rows:44px 1fr; grid-template-columns:310px 1fr 270px; }
  #top { grid-column:1 / -1; display:flex; align-items:center; gap:8px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  #top h1 { margin:0 8px 0 0; font-size:14px; white-space:nowrap; }
  #autosave { font-size:11px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tb { padding:5px 11px; border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--ink); cursor:pointer; font-size:12px; text-decoration:none; white-space:nowrap; }
  .tb:hover:not(:disabled) { border-color:var(--accent); }
  .tb.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .tb:disabled { opacity:.5; cursor:wait; }
  .sepv { width:1px; height:20px; background:var(--line); margin:0 4px; }

  aside { background:var(--panel); overflow:auto; min-height:0; }
  #left { border-right:1px solid var(--line); padding:8px; }
  #right { border-left:1px solid var(--line); display:flex; flex-direction:column; }
  #right .scroll { flex:1; overflow:auto; padding:10px 12px; }
  #right .run { padding:10px 12px; border-top:1px solid var(--line); background:var(--panel); }

  /* ---- 素材ゾーン */
  .zone { border:1px solid var(--line); border-radius:9px; background:var(--card); margin-bottom:8px; overflow:hidden; }
  .zone > header { display:flex; align-items:center; gap:6px; padding:6px 8px; }
  .zone .zt { font-weight:600; font-size:12px; }
  .zone .zh { color:var(--sub); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { min-width:20px; padding:0 6px; border-radius:999px; background:var(--line); font-size:10px; text-align:center; line-height:16px; }
  .zone[data-tier="0"] { border-top:3px solid var(--c0); } .zone[data-tier="1"] { border-top:3px solid var(--c1); } .zone[data-tier="2"] { border-top:3px solid var(--c2); }
  .zone.pool { border-style:dashed; }
  .zone.over { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .mini { padding:2px 8px; border:1px solid var(--line); border-radius:999px; background:var(--panel); color:var(--ink); cursor:pointer; font-size:10px; white-space:nowrap; }
  .mini:hover { border-color:var(--accent); }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(40px,1fr)); gap:5px; padding:0 8px 8px; min-height:14px; }
  .thumbs:empty { padding:2px 8px 10px; display:block; }
  .thumbs:empty::before { content:attr(data-empty); color:var(--sub); font-size:11px; }
  .th { position:relative; aspect-ratio:1; border:1px solid var(--line); border-radius:6px; background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
  .th img { max-width:84%; max-height:84%; pointer-events:none; }
  .th.sel { outline:3px solid var(--accent); outline-offset:1px; }
  .th button { position:absolute; top:-5px; right:-5px; width:15px; height:15px; border-radius:50%; border:0; background:#555; color:#fff; font-size:9px; line-height:15px; padding:0; cursor:pointer; display:none; }
  .th button.back { right:auto; left:-5px; background:var(--accent); }
  .th:hover button { display:block; }
  .acts { display:flex; flex-wrap:wrap; gap:4px; padding:0 8px 8px; align-items:center; }
  .acts .lbl { width:100%; font-size:10px; color:var(--sub); }
  .acts .mini.c0 { border-color:var(--c0); } .acts .mini.c1 { border-color:var(--c1); } .acts .mini.c2 { border-color:var(--c2); }

  /* ---- 設定 */
  .grp { margin-bottom:14px; }
  .grp h2 { margin:0 0 6px; font-size:11px; color:var(--sub); font-weight:600; letter-spacing:.04em; }
  .rl { padding:6px 8px 4px; margin-bottom:6px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .rl .rn { font-weight:600; font-size:12px; display:flex; align-items:center; gap:6px; }
  .rl i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .row { display:grid; grid-template-columns:64px 1fr 46px; align-items:center; gap:6px; margin:5px 0; font-size:11px; }
  .row label { color:var(--sub); }
  .row output { text-align:right; color:var(--ink); font-variant-numeric:tabular-nums; }
  .row input[type=range] { width:100%; accent-color:var(--accent); }
  select, input[type=number] { width:100%; padding:3px 6px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); font-size:12px; }
  .btn { display:block; width:100%; padding:9px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .btn.sec { background:var(--panel); color:var(--ink); border:1px solid var(--line); font-weight:500; font-size:12px; padding:6px; margin-top:6px; }
  #status { margin-top:8px; font-size:11px; color:var(--sub); min-height:16px; line-height:1.4; }

  /* ---- 中央キャンバス */
  #center { background:var(--canvas); display:flex; flex-direction:column; min-width:0; min-height:0; }
  .cbar { display:flex; align-items:center; gap:10px; padding:8px 12px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel); }
  .seg button { padding:4px 12px; border:0; background:transparent; color:var(--ink); cursor:pointer; font-size:12px; }
  .seg button.on { background:var(--accent); color:#fff; }
  .cbar .hint { font-size:11px; color:var(--sub); }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:0 16px 16px; }
  #view { height:100%; max-width:100%; aspect-ratio:1; border:1px solid var(--line); border-radius:6px; background:#fff no-repeat center / contain; box-shadow:0 2px 14px rgba(0,0,0,.12); display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:13px; text-align:center; padding:12px; }
  #view.x3 { background-repeat:repeat; }

  /* ---- 狭い画面: 縦に積んでページ全体をスクロール */
  @media (max-width:1000px) {
    body { overflow:auto; }
    #app { display:block; height:auto; }
    #top { flex-wrap:wrap; padding:8px 12px; }
    aside { overflow:visible; }
    #left, #right { border:0; }
    #stage { padding:0 12px 12px; } #view { height:auto; width:100%; }
    #right .run { position:sticky; bottom:0; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1>散らし柄タイルメーカー</h1>
    <button class="tb" id="prjSave" title="画像・振り分け・設定を1つの .json にまとめて保存します">プロジェクト保存</button>
    <button class="tb" id="prjLoad" title="保存した .json から復元します">開く</button>
    <button class="tb" id="prjClear" title="素材をすべて消します（設定は残ります）">素材クリア</button>
    <input type="file" id="prjFile" accept=".json,application/json" hidden>
    <span class="sp"></span>
    <span id="autosave">この端末内で処理・自動保存（画像は外部に送信されません）</span>
    <span class="sepv"></span>
    <a class="tb" id="dlPng" hidden download="tile.png">PNG保存</a>
    <button class="tb primary" id="dlPptx" hidden>PPTX保存</button>
  </header>

  <aside id="left">
    <div id="tiers"></div>
  </aside>

  <main id="center">
    <div class="cbar">
      <div class="seg"><button id="t1">1枚</button><button id="t3" class="on">3×3</button></div>
      <span class="hint">3×3 で上下左右の継ぎ目を確認できます</span>
    </div>
    <div id="stage"><div id="view"><span id="empty">素材を入れて「タイルを作る」を押してください</span></div></div>
  </main>

  <aside id="right">
    <div class="scroll">
      <div class="grp">
        <h2>全体</h2>
        <div class="row"><label for="size" title="メインのイラストの大きさ（キャンバス幅に対する割合）">基準サイズ</label><input id="size" type="range" min="0.08" max="0.22" step="0.005" value="0.13"><output></output></div>
        <div class="row"><label for="gap" title="イラスト同士の最低限の距離">すき間</label><input id="gap" type="range" min="0" max="0.06" step="0.005" value="0.02"><output></output></div>
        <div class="row"><label for="rotate" title="ランダム回転の最大角度">傾き(±°)</label><input id="rotate" type="range" min="0" max="45" step="1" value="12"><output></output></div>
        <div class="row"><label for="seed" title="配置パターンの番号。同じ番号なら同じ配置になります">シード</label><input id="seed" type="number" value="1" min="1"><span></span></div>
        <div class="row"><label for="px">解像度</label>
          <select id="px"><option value="2048">2048 px</option><option value="4096" selected>4096 px</option><option value="6000">6000 px</option></select><span></span></div>
      </div>
      <div class="grp">
        <h2>役割ごと</h2>
        <div class="rl"><div class="rn"><i style="background:var(--c0)"></i>メイン</div>
          <div class="row"><label>使用回数</label><input type="range" id="rep0" min="1" max="6" step="1" value="1"><output></output></div>
          <div class="row"><label>サイズ倍率</label><input type="range" id="scl0" min="0.2" max="1.4" step="0.02" value="1"><output></output></div></div>
        <div class="rl"><div class="rn"><i style="background:var(--c1)"></i>サブ</div>
          <div class="row"><label>使用回数</label><input type="range" id="rep1" min="1" max="6" step="1" value="1"><output></output></div>
          <div class="row"><label>サイズ倍率</label><input type="range" id="scl1" min="0.2" max="1.4" step="0.02" value="0.62"><output></output></div></div>
        <div class="rl"><div class="rn"><i style="background:var(--c2)"></i>アクセント</div>
          <div class="row"><label>使用回数</label><input type="range" id="rep2" min="1" max="6" step="1" value="1"><output></output></div>
          <div class="row"><label>サイズ倍率</label><input type="range" id="scl2" min="0.2" max="1.4" step="0.02" value="0.38"><output></output></div></div>
      </div>
    </div>
    <div class="run">
      <button id="go" class="btn">タイルを作る</button>
      <button id="shuffle" class="btn sec">別のパターンで作る</button>
      <div id="status"></div>
    </div>
  </aside>
</div>

<script src="lib/pptxgen.bundle.js"></script>

<!-- ============ 生成処理 (Web Worker で実行。画面が固まらない) ============ -->
<script id="worker-src" type="javascript/worker">
const SPRITE_ALPHA_CROP = 8;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function alphaBBox(d, w, h, th) {
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > th) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  return x1 < 0 ? null : {x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1};
}

// ---- 素材の前処理: 外周とつながった白だけを透明にする (ゴーストの内側の白は残す)
function prep(bmp) {
  const w = bmp.width, h = bmp.height;
  const c = new OffscreenCanvas(w, h), x = c.getContext('2d', {willReadFrequently: true});
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(bmp, 0, 0);
  const id = x.getImageData(0, 0, w, h), d = id.data, n = w * h;
  const near = new Uint8Array(n);
  for (let i = 0; i < n; i++) near[i] = Math.min(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]) >= 232 ? 1 : 0;
  const bg = new Uint8Array(n), stack = new Int32Array(n); let sp = 0;
  const seed = (px, py) => { const i = py * w + px; if (near[i] && !bg[i]) { bg[i] = 1; stack[sp++] = i; } };
  for (let i = 0; i < w; i++) { seed(i, 0); seed(i, h - 1); }
  for (let j = 0; j < h; j++) { seed(0, j); seed(w - 1, j); }
  while (sp) {
    const i = stack[--sp], px = i % w, py = (i / w) | 0;
    if (px > 0) seed(px - 1, py); if (px < w - 1) seed(px + 1, py);
    if (py > 0) seed(px, py - 1); if (py < h - 1) seed(px, py + 1);
  }
  // 白い縁を1px削る (3x3 最小値) → なめらかに (ガウシアン σ=0.8)
  let a = new Float32Array(n);
  for (let i = 0; i < n; i++) a[i] = bg[i] ? 0 : 255;
  const er = new Float32Array(n);
  for (let y = 0; y < h; y++) for (let x2 = 0; x2 < w; x2++) {
    let m = 255;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const yy = Math.min(h - 1, Math.max(0, y + dy)), xx = Math.min(w - 1, Math.max(0, x2 + dx));
      const v = a[yy * w + xx]; if (v < m) m = v;
    }
    er[y * w + x2] = m;
  }
  const ker = []; let ks = 0;
  for (let k = -2; k <= 2; k++) { const v = Math.exp(-k * k / (2 * 0.8 * 0.8)); ker.push(v); ks += v; }
  const tmp = new Float32Array(n);
  for (let y = 0; y < h; y++) for (let x2 = 0; x2 < w; x2++) {
    let s = 0; for (let k = -2; k <= 2; k++) s += er[y * w + Math.min(w - 1, Math.max(0, x2 + k))] * ker[k + 2];
    tmp[y * w + x2] = s / ks;
  }
  for (let y = 0; y < h; y++) for (let x2 = 0; x2 < w; x2++) {
    let s = 0; for (let k = -2; k <= 2; k++) s += tmp[Math.min(h - 1, Math.max(0, y + k)) * w + x2] * ker[k + 2];
    d[(y * w + x2) * 4 + 3] = Math.round(s / ks);
  }
  const bb = alphaBBox(d, w, h, SPRITE_ALPHA_CROP);
  if (!bb) throw new Error('素材が真っ白 (または全面が背景) と判定されました');
  x.putImageData(id, 0, 0);
  const oc = new OffscreenCanvas(bb.w, bb.h);
  oc.getContext('2d').drawImage(c, bb.x, bb.y, bb.w, bb.h, 0, 0, bb.w, bb.h);
  let area = 0;
  for (let y = bb.y; y < bb.y + bb.h; y++) for (let x2 = bb.x; x2 < bb.x + bb.w; x2++) if (d[(y * w + x2) * 4 + 3] > 128) area++;
  // 面積と最大寸法の中間で大きさを揃える
  return {canvas: oc, w: bb.w, h: bb.h, metric: Math.sqrt(Math.sqrt(area) * Math.max(bb.w, bb.h))};
}

function makeSprite(src, k, angDeg) {
  const w = Math.max(1, Math.round(src.w * k)), h = Math.max(1, Math.round(src.h * k));
  const rad = angDeg * Math.PI / 180;
  const cw = Math.ceil(Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad))) + 2;
  const ch = Math.ceil(Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad))) + 2;
  const c = new OffscreenCanvas(cw, ch), x = c.getContext('2d', {willReadFrequently: true});
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.translate(cw / 2, ch / 2); x.rotate(rad);
  x.drawImage(src.canvas, -w / 2, -h / 2, w, h);
  const d = x.getImageData(0, 0, cw, ch).data;
  const bb = alphaBBox(d, cw, ch, SPRITE_ALPHA_CROP) || {x: 0, y: 0, w: cw, h: ch};
  const oc = new OffscreenCanvas(bb.w, bb.h);
  oc.getContext('2d').drawImage(c, bb.x, bb.y, bb.w, bb.h, 0, 0, bb.w, bb.h);
  return {canvas: oc, w: bb.w, h: bb.h};
}

// ---- 配置: 上下左右がつながる面(トーラス)上で、重ならず均等に散る位置を求める
const tdelta = d => d - Math.round(d);
function place(radii, groups, rng, gap, sameGap) {
  const n = radii.length;
  const need = new Float64Array(n * n);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++)
    need[i * n + j] = radii[i] + radii[j] + gap + (groups[i] === groups[j] ? sameGap : 0);
  const order = [...Array(n).keys()].sort((a, b) => radii[b] - radii[a]);
  const pos = new Float64Array(n * 2), placed = [];
  for (const i of order) {   // best-candidate 法: 既存配置から一番余裕がある場所を選ぶ
    if (!placed.length) { pos[i * 2] = rng(); pos[i * 2 + 1] = rng(); }
    else {
      let bx = 0, by = 0, bs = -1e9;
      for (let c = 0; c < 400; c++) {
        const cx = rng(), cy = rng(); let sc = 1e9;
        for (const j of placed) {
          const d = Math.hypot(tdelta(cx - pos[j * 2]), tdelta(cy - pos[j * 2 + 1])) - need[i * n + j];
          if (d < sc) sc = d;
        }
        if (sc > bs) { bs = sc; bx = cx; by = cy; }
      }
      pos[i * 2] = bx; pos[i * 2 + 1] = by;
    }
    placed.push(i);
  }
  const ITERS = 60;
  for (let it = 0; it < ITERS; it++) {   // 反発で均す
    const step = 0.02 * (1 - it / ITERS) + 0.002, f = new Float64Array(n * 2);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const dx = tdelta(pos[i * 2] - pos[j * 2]), dy = tdelta(pos[i * 2 + 1] - pos[j * 2 + 1]);
      const dist = Math.hypot(dx, dy) + 1e-9, reach = need[i * n + j] * 1.7;
      const w = Math.max(0, 1 - dist / reach) ** 2;
      f[i * 2] += dx / dist * w; f[i * 2 + 1] += dy / dist * w;
    }
    for (let i = 0; i < n * 2; i++) pos[i] = (((pos[i] + f[i] * step) % 1) + 1) % 1;
  }
  return pos;
}

// ---- 低解像度でアルファ同士の重なりを実測
function countOverlap(sprites, pos, px) {
  const W = 1024, s = W / px, total = new Uint8Array(W * W);
  sprites.forEach((sp, i) => {
    const mw = Math.max(1, Math.floor(sp.w * s)), mh = Math.max(1, Math.floor(sp.h * s));
    const c = new OffscreenCanvas(mw, mh), x = c.getContext('2d', {willReadFrequently: true});
    x.drawImage(sp.canvas, 0, 0, mw, mh);
    const d = x.getImageData(0, 0, mw, mh).data;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const ox = Math.round((pos[i * 2] + dx) * W - mw / 2), oy = Math.round((pos[i * 2 + 1] + dy) * W - mh / 2);
      for (let y = Math.max(0, oy); y < Math.min(W, oy + mh); y++) for (let x2 = Math.max(0, ox); x2 < Math.min(W, ox + mw); x2++)
        if (d[((y - oy) * mw + (x2 - ox)) * 4 + 3] > 128) total[y * W + x2]++;
    }
  });
  let bad = 0; for (let i = 0; i < total.length; i++) if (total[i] > 1) bad++;
  return bad;
}

function build(motifs, a, seed) {
  const rng = mulberry32(seed), px = a.px, seq = [], tiers = [];
  for (let t = 0; t < 3; t++) {   // 役割ごとに全種を巡回 (連続重複なし)
    const pool = motifs.map((m, i) => m.tier === t ? i : -1).filter(i => i >= 0), count = a.counts[t];
    if (!pool.length || count <= 0) continue;
    let part = [];
    while (part.length < count) {
      const cyc = shuffle(pool.slice(), rng);
      if (part.length && pool.length > 1 && cyc[0] === part[part.length - 1]) cyc.push(cyc.shift());
      part = part.concat(cyc);
    }
    part.slice(0, count).forEach(g => { seq.push(g); tiers.push(t); });
  }
  const sprites = [], radii = [], groups = [];
  seq.forEach((gi, n) => {
    const m = motifs[gi];
    const k = a.size * a.scales[tiers[n]] * px * (0.92 + 0.16 * rng()) / m.metric;
    const sp = makeSprite(m, k, (rng() * 2 - 1) * a.rotate);
    sprites.push(sp); radii.push(0.5 * Math.hypot(sp.w, sp.h) * 0.78 / px); groups.push(gi);
  });
  const pos = place(radii, groups, rng, a.gap, 0.12);
  return {seq, sprites, pos, bad: countOverlap(sprites, pos, px)};
}

async function render(sprites, pos, px) {
  const c = new OffscreenCanvas(px, px), x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, px, px);
  sprites.forEach((sp, i) => {
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++)   // 端をまたぐものは反対側にも描く
      x.drawImage(sp.canvas, Math.round((pos[i * 2] + dx) * px - sp.w / 2), Math.round((pos[i * 2 + 1] + dy) * px - sp.h / 2));
  });
  return c.convertToBlob({type: 'image/png'});
}

self.onmessage = async e => {
  try {
    const {sources, params: p} = e.data, px = +p.px;
    const motifs = sources.map(s => Object.assign({name: s.name, tier: s.tier}, prep(s.bitmap)));
    const args = {px, size: +p.size, gap: +p.gap, rotate: +p.rotate, scales: p.scales.map(Number),
      counts: [0, 1, 2].map(t => motifs.filter(m => m.tier === t).length * (+p.repeats[t]))};
    const seed0 = Math.floor(+p.seed), t0 = Date.now();
    let best = null;
    for (let t = 0; t < 30; t++) {   // 重なりが残る時は別シードで再試行 (最大30回/40秒。最良の結果を採用)
      const cur = seed0 + t, r = build(motifs, args, cur); r.seed = cur;
      if (!best || r.bad < best.bad) best = r;
      self.postMessage({type: 'progress', attempt: t + 1, bad: best.bad});
      if (best.bad === 0 || Date.now() - t0 > 40000) break;
    }
    const tile = await render(best.sprites, best.pos, px);
    const sprites = [];
    for (let i = 0; i < best.sprites.length; i++)
      sprites.push({blob: await best.sprites[i].canvas.convertToBlob({type: 'image/png'}),
        w: best.sprites[i].w, h: best.sprites[i].h, cx: best.pos[i * 2], cy: best.pos[i * 2 + 1]});
    self.postMessage({type: 'done', tile, sprites, px, seed: best.seed, bad: best.bad, count: best.seq.length});
  } catch (err) {
    self.postMessage({type: 'error', message: String((err && err.message) || err)});
  }
};
</script>

<!-- ============ 画面 ============ -->
<script>
const $ = id => document.getElementById(id);
const SLIDE_CM = 52.921;
// 役割: 名前(仮)・ヒント・サイズ倍率
const TIERS = [
  {name:'メイン',     hint:'ゴースト・かぼちゃなど大きめ', scale:1.0},
  {name:'サブ',       hint:'葉っぱ・あめなど小さめ',       scale:0.62},
  {name:'アクセント', hint:'水玉・星など細かい装飾',       scale:0.38},
];
let images = [];   // {name, file, url, tier}

let nextId = 1, saveTimer = null, restored = false;
const selected = new Set();   // 選択中の画像id
const zoneId = t => 'th' + (t < 0 ? 'P' : t), cntId = t => 'cn' + (t < 0 ? 'P' : t);
const wrap = $('tiers');

function buildZone(t) {
  const meta = t < 0 ? {name: '未振り分け', hint: 'まとめてここへ'} : TIERS[t];
  const d = document.createElement('section'); d.className = 'zone' + (t < 0 ? ' pool' : ''); d.dataset.tier = t;
  d.innerHTML = `
    <header><span class="zt">${meta.name}</span><span class="badge" id="${cntId(t)}">0</span><span class="zh">${meta.hint}</span><span class="sp"></span>
      ${t < 0 ? '<button class="mini" data-add="1">＋ 追加</button>' : `<button class="mini" data-back="${t}" title="この枠を全て未振り分けへ戻す">↩ 全て戻す</button>`}</header>
    <div class="thumbs" id="${zoneId(t)}" data-empty="${t < 0 ? 'ここに画像をドロップ（複数可）／ ＋追加' : 'ここにドロップ／下の選択ボタンで振り分け'}"></div>
    <input type="file" accept="image/*,.svg" multiple hidden>` + (t < 0 ? `
    <div class="acts">
      <span class="lbl">クリックで選択（複数可）→ 移動先　<b id="selCount">0</b>枚選択中</span>
      ${TIERS.map((x, i) => `<button class="mini c${i}" data-to="${i}">${x.name}へ</button>`).join('')}
      <button class="mini" data-to="-1">未振り分けへ</button>
      <button class="mini" data-sel="pool">全選択</button><button class="mini" data-sel="none">解除</button>
    </div>` : '');
  wrap.appendChild(d);
  const file = d.querySelector('input[type=file]');
  const add = d.querySelector('[data-add]'); if (add) add.onclick = () => file.click();
  file.onchange = e => { addFiles(e.target.files, t); e.target.value = ''; };
  // 画像のドラッグ移動 / ファイルのドロップ追加 (枠全体が受け皿)
  d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', e => { if (!d.contains(e.relatedTarget)) d.classList.remove('over'); });
  d.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation(); d.classList.remove('over');
    const own = e.dataTransfer.getData('text/x-scatter');
    if (own) moveImages(JSON.parse(own), t); else addFiles(e.dataTransfer.files, t);
  });
  d.querySelectorAll('button[data-back], .acts button').forEach(btn => btn.onclick = () => {
    if (btn.dataset.back != null) moveImages(images.filter(im => im.tier === t).map(im => im.id), -1);
    else if (btn.dataset.to != null) { if (selected.size) moveImages([...selected], +btn.dataset.to); }
    else { selected.clear(); if (btn.dataset.sel === 'pool') images.filter(im => im.tier < 0).forEach(im => selected.add(im.id)); renderThumbs(); }
  });
}
[-1, 0, 1, 2].forEach(buildZone);
// 枠の外にドロップしてもブラウザが画像を開いてしまわないように
['dragover', 'drop'].forEach(t => window.addEventListener(t, e => e.preventDefault()));

function addFiles(files, tier) {
  [...files].filter(f => f.type.startsWith('image/') || isSvg(f)).forEach(f => {
    if (isSvg(f) && f.type !== 'image/svg+xml') f = new File([f], f.name, {type: 'image/svg+xml'});   // 種類が空でも SVG として読む
    pushImage(f.name, f, tier);
  });
  renderThumbs();
}
function moveImages(ids, to) {
  const set = new Set(ids);
  images.forEach(im => { if (set.has(im.id)) im.tier = to; });
  selected.clear(); renderThumbs();
}
function renderThumbs() {
  [-1, 0, 1, 2].forEach(t => { $(zoneId(t)).innerHTML = ''; $(cntId(t)).textContent = images.filter(m => m.tier === t).length; });
  images.forEach(im => {
    const d = document.createElement('div'); d.className = 'th' + (selected.has(im.id) ? ' sel' : '');
    d.draggable = true; d.title = im.name;
    d.innerHTML = `<img src="${im.url}" alt="" draggable="false"><button title="削除">×</button>${im.tier >= 0 ? '<button class="back" title="未振り分けに戻す">↩</button>' : ''}`;
    const back = d.querySelector('button.back');
    if (back) back.onclick = ev => { ev.stopPropagation(); moveImages([im.id], -1); };
    d.querySelector('button').onclick = ev => {
      ev.stopPropagation(); URL.revokeObjectURL(im.url); selected.delete(im.id);
      images.splice(images.indexOf(im), 1); renderThumbs();
    };
    d.onclick = () => { selected.has(im.id) ? selected.delete(im.id) : selected.add(im.id); renderThumbs(); };
    d.ondragstart = e => {   // 選択中の画像をつかんだら選択分をまとめて、そうでなければその1枚だけ移動
      const ids = selected.has(im.id) ? [...selected] : [im.id];
      e.dataTransfer.setData('text/x-scatter', JSON.stringify(ids)); e.dataTransfer.effectAllowed = 'move';
    };
    $(zoneId(im.tier)).appendChild(d);
  });
  $('selCount').textContent = selected.size;
  scheduleSave();
}

// 設定値の表示と保存 (次回開いた時に復元)
const KEY = 'scatter-tile-settings-v1';
const SAVED = ['size', 'gap', 'rotate', 'seed', 'px', ...TIERS.flatMap((_, i) => ['rep' + i, 'scl' + i])];
function loadSettings() {
  try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); SAVED.forEach(k => { if (s[k] != null && $(k)) $(k).value = s[k]; }); } catch (e) {}
}
function saveSettings() {
  try { const s = {}; SAVED.forEach(k => s[k] = $(k).value); localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
}
loadSettings();
document.querySelectorAll('.row input[type=range]').forEach(r => {
  const o = r.parentElement.querySelector('output');
  const upd = () => o.textContent = r.id === 'size' || r.id === 'gap' ? (r.value * 100).toFixed(1) + '%'
    : r.id.startsWith('scl') ? '×' + (+r.value).toFixed(2) : r.id.startsWith('rep') ? r.value + '回ずつ' : r.value;
  r.addEventListener('input', () => { upd(); saveSettings(); }); upd();
});
['seed', 'px'].forEach(k => $(k).addEventListener('change', saveSettings));

// ---- 自動保存 (IndexedDB): 素材と振り分けを、次に開いた時に復元
const idb = fn => new Promise((res, rej) => {
  const r = indexedDB.open('scatter-tile', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onerror = () => rej(r.error);
  r.onsuccess = () => fn(r.result, res, rej);
});
const dbGet = k => idb((db, res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const dbSet = (k, v) => idb((db, res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
function scheduleSave() {
  if (!restored) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await dbSet('images', images.map(({name, file, tier}) => ({name, file, tier}))); }
    catch (e) { $('autosave').textContent = '自動保存できませんでした（ブラウザの設定・容量をご確認ください）。ファイル保存をご利用ください。'; }
  }, 400);
}
function clearImages() { images.forEach(im => URL.revokeObjectURL(im.url)); images.length = 0; selected.clear(); }
function pushImage(name, file, tier) { images.push({id: nextId++, name, file, url: URL.createObjectURL(file), tier}); }
(async () => {
  try {
    const saved = await dbGet('images');
    if (saved && saved.length) { saved.forEach(s => pushImage(s.name, s.file, s.tier)); renderThumbs(); $('status').textContent = `前回の素材 ${saved.length} 枚を復元しました`; }
  } catch (e) {}
  restored = true;
})();

// ---- ファイルで保存 / 読み込み (画像と設定を1つの .json にまとめる)
const blobToDataUrl = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
function dataUrlToBlob(u) {
  const [head, b64] = u.split(','), bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: head.slice(5).split(';')[0]});
}
function applySettings(st) {
  SAVED.forEach(k => { if (st[k] != null && $(k)) { $(k).value = st[k]; $(k).dispatchEvent(new Event('input')); } });
  saveSettings();
}
$('prjSave').onclick = async () => {
  if (!images.length) { $('status').textContent = '保存する素材がありません'; return; }
  const settings = {}; SAVED.forEach(k => settings[k] = $(k).value);
  const proj = {app: 'scatter-tile', version: 1, settings,
    images: await Promise.all(images.map(async im => ({name: im.name, type: im.file.type, tier: im.tier, data: await blobToDataUrl(im.file)})))};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(proj)], {type: 'application/json'}));
  a.download = `scatter-project-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  $('status').textContent = `プロジェクトを保存しました (素材${images.length}枚)`;
};
$('prjLoad').onclick = () => $('prjFile').click();
$('prjFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const p = JSON.parse(await f.text());
    if (p.app !== 'scatter-tile' || !Array.isArray(p.images)) throw new Error('このアプリのプロジェクトファイルではありません');
    if (images.length && !confirm('現在の素材を破棄して、プロジェクトを読み込みますか？')) return;
    clearImages();
    p.images.forEach(it => { const b = dataUrlToBlob(it.data); pushImage(it.name, new File([b], it.name, {type: it.type || b.type}), it.tier); });
    applySettings(p.settings || {}); renderThumbs();
    $('status').textContent = `プロジェクトを読み込みました (素材${images.length}枚)`;
  } catch (err) { $('status').textContent = '読み込みエラー: ' + err.message; }
};
$('prjClear').onclick = () => {
  if (!images.length || !confirm('素材をすべて消します。よろしいですか？（設定は残ります）')) return;
  clearImages(); renderThumbs(); $('status').textContent = '素材をクリアしました';
};

// ---- 生成
// SVG は createImageBitmap で直接読めないので、<img> 経由で十分大きく描画してから渡す
const isSvg = f => f.type === 'image/svg+xml' || /\.svg$/i.test(f.name);
async function toBitmap(im) {
  if (!isSvg(im.file)) return createImageBitmap(im.file);
  const img = new Image(); img.src = im.url; await img.decode();
  const nw = img.naturalWidth || 300, nh = img.naturalHeight || 300, k = 1600 / Math.max(nw, nh);
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(nw * k)); c.height = Math.max(1, Math.round(nh * k));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return createImageBitmap(c);
}
const workerUrl = URL.createObjectURL(new Blob([$('worker-src').textContent], {type: 'text/javascript'}));
let worker = null, result = null, tileUrl = null;

function setBusy(b) { $('go').disabled = $('shuffle').disabled = b; }
async function run(newSeed) {
  const use = images.filter(im => im.tier >= 0), pool = images.length - use.length;
  if (!use.length) { $('status').textContent = images.length ? '画像をメイン/サブ/アクセントに振り分けてください' : '先に素材を入れてください'; return; }
  if (newSeed) { $('seed').value = Math.floor(Math.random() * 9000) + 1; saveSettings(); }
  setBusy(true);
  const t0 = Date.now(); let attempt = 0;
  const tick = setInterval(() => $('status').textContent =
    `生成中… ${Math.round((Date.now() - t0) / 1000)}秒${attempt > 1 ? ` (重なりを避けて再試行 ${attempt}回目)` : ''}`, 300);
  const finish = msg => { clearInterval(tick); $('status').textContent = msg; setBusy(false); if (worker) { worker.terminate(); worker = null; } };
  try {
    const bitmaps = await Promise.all(use.map(toBitmap));
    const params = {size: $('size').value, gap: $('gap').value, rotate: $('rotate').value, seed: $('seed').value, px: $('px').value,
      repeats: TIERS.map((_, i) => $('rep' + i).value), scales: TIERS.map((_, i) => $('scl' + i).value)};
    worker = new Worker(workerUrl);
    worker.onmessage = e => {
      const m = e.data;
      if (m.type === 'progress') attempt = m.attempt;
      else if (m.type === 'error') finish('エラー: ' + m.message);
      else if (m.type === 'done') {
        show(m); $('seed').value = m.seed; saveSettings();
        finish(m.bad === 0 ? `完了: ${m.count}個、重なりなし (seed ${m.seed}、${Math.round((Date.now() - t0) / 1000)}秒)${pool ? `。未振り分け${pool}枚は使っていません` : ''}`
          : '重なりが残っています。「すき間」を増やすか、サイズ・使用回数を減らしてください');
      }
    };
    worker.onerror = e => finish('エラー: ' + (e.message || '不明なエラー'));
    worker.postMessage({sources: use.map((im, i) => ({name: im.name, tier: im.tier, bitmap: bitmaps[i]})), params}, bitmaps);
  } catch (e) { finish('エラー: ' + e.message); }
}

function show(m) {
  result = m;
  if (tileUrl) URL.revokeObjectURL(tileUrl);
  tileUrl = URL.createObjectURL(m.tile);
  $('view').style.backgroundImage = `url(${tileUrl})`;
  $('empty').hidden = true;
  $('dlPng').href = tileUrl; $('dlPng').hidden = false; $('dlPptx').hidden = false;
  setTab(tab3);
}

// ---- PPTX (各イラストが個別オブジェクト。端をまたぐものは反対側にもはみ出して配置)
const toB64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
$('dlPptx').onclick = async () => {
  if (!result) return;
  $('dlPptx').disabled = true; const old = $('dlPptx').textContent; $('dlPptx').textContent = '作成中…';
  try {
    const S = SLIDE_CM / 2.54, pptx = new PptxGenJS();
    pptx.defineLayout({name: 'SQ', width: S, height: S}); pptx.layout = 'SQ';
    const slide = pptx.addSlide(); slide.background = {color: 'FFFFFF'};
    for (const sp of result.sprites) {
      const data = 'image/png;base64,' + await toB64(sp.blob), w = sp.w / result.px * S, h = sp.h / result.px * S;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        const x = (sp.cx + dx) * S - w / 2, y = (sp.cy + dy) * S - h / 2;
        if (x + w <= 0 || y + h <= 0 || x >= S || y >= S) continue;
        slide.addImage({data, x, y, w, h});
      }
    }
    const blob = await pptx.write({outputType: 'blob'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'scatter.pptx'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (e) { $('status').textContent = 'PPTX作成エラー: ' + e.message; }
  $('dlPptx').disabled = false; $('dlPptx').textContent = old;
};

let tab3 = true;
function setTab(x3) {
  tab3 = x3;
  $('t1').classList.toggle('on', !x3); $('t3').classList.toggle('on', x3);
  $('view').classList.toggle('x3', x3);
  $('view').style.backgroundSize = x3 ? '33.333% 33.333%' : 'contain';
}
$('t1').onclick = () => setTab(false);
$('t3').onclick = () => setTab(true);
$('go').onclick = () => run(false);
$('shuffle').onclick = () => run(true);
setTab(true);
</script>
</body>
</html>
